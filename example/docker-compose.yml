name: go-overlay-example

services:

  mongo:
    image: mongo:8
    container_name: go-overlay-example-mongo
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  mysql:
    image: mysql:8
    container_name: go-overlay-example-mysql
    ports:
      - "3308:3306"
    environment:
      MYSQL_ROOT_PASSWORD: example
      MYSQL_DATABASE: appdb
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppass
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pexample"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ..
      dockerfile: example/Dockerfile
    container_name: go-overlay-example-app
    depends_on:
      mongo:
        condition: service_healthy
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      MONGO_URL: mongodb://root:example@mongo:27017
      MYSQL_URL: appuser:apppass@tcp(mysql:3306)/appdb
      EVENT_STORAGE: appuser:apppass@tcp(mysql:3306)/appdb
      BEEF_STORAGE: mysql://appuser:apppass@mysql:3306/appdb
      PORT: "8080"
      SERVER_PRIVATE_KEY: 6f552333a2dd110ba07c60f9888ec903a3ef62b7f43983c285dd760a7456eb33
      HOSTING_URL: https://your.overlay.network

volumes:
  mongo_data:
  mysql_data:
